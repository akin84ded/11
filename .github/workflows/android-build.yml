name: MOS2 Android source check and APK build

on:
  workflow_dispatch:
  push:
    paths:
      - 'MOS2_Android_2.0_SOURCE.zip'
      - 'AndroidManifest.xml'
      - '.github/scripts/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  inspect-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q MOS2_Android_2.0_SOURCE.zip -d source
          echo "Files extracted from source archive:"
          find source -maxdepth 5 -type f -printf '%p (%s bytes)\n' | sort | tee source-files.txt
          echo
          echo "Gradle project markers:"
          find source -type f \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \) -print | tee gradle-markers.txt

      - name: Repair Android build configuration
        shell: bash
        run: |
          set -euo pipefail
          PROPS="$(find source -type f -name gradle.properties -path '*/android/gradle.properties' -print -quit)"
          if [[ -z "$PROPS" ]]; then
            echo "Android Gradle properties file was not found" >&2
            exit 1
          fi
          grep -q '^android.useAndroidX=true$' "$PROPS" || echo 'android.useAndroidX=true' >> "$PROPS"
          grep -q '^android.enableJetifier=true$' "$PROPS" || echo 'android.enableJetifier=true' >> "$PROPS"
          # Repair an accidentally stored literal backslash-n in XML manifests.
          while IFS= read -r -d '' manifest; do
            python3 - "$manifest" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          s = s.replace(r"\n", "\n")
          p.write_text(s, encoding="utf-8")
          PY
          done < <(find source -type f -name AndroidManifest.xml -print0)
          echo "Updated $PROPS:"
          cat "$PROPS"
          # Java sources use ActivityCompat and ContextCompat from AndroidX Core.
          APP_GRADLE="$(find source -type f -path '*/app/build.gradle' -print -quit)"
          if [[ -z "$APP_GRADLE" ]]; then
            echo "App Gradle build file was not found" >&2
            exit 1
          fi
          python3 - "$APP_GRADLE" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          deps = []
          if "androidx.core:core" not in s: deps.append("implementation 'androidx.core:core:1.13.1'")
          if "androidx.work:work-runtime" not in s: deps.append("implementation 'androidx.work:work-runtime:2.9.1'")
          if deps:
              s += "\ndependencies { " + "; ".join(deps) + " }\n"
              p.write_text(s, encoding="utf-8")
          print(f"Verified AndroidX Core dependency in {p}")
          PY

      - name: Apply standalone Prosperity Android app
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="$(dirname "$(find source -type f -path '*/app/build.gradle' -print -quit)")"
          python3 .github/scripts/patch_prosperity.py "$APP_DIR"

      - name: Configure persistent release signing when a keystore is supplied
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "No persistent signing key configured; debug APK only." | tee signing-status.txt
            exit 0
          fi
          if [[ -z "${ANDROID_KEYSTORE_PASSWORD}" || -z "${ANDROID_KEY_ALIAS}" || -z "${ANDROID_KEY_PASSWORD}" ]]; then
            echo "Keystore secrets are incomplete. Configure all four ANDROID_* secrets." >&2
            exit 1
          fi
          APP_GRADLE="$(find source -type f -path '*/app/build.gradle' -print -quit)"
          APP_DIR="$(dirname "$APP_GRADLE")"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$APP_DIR/prosperity-upload.jks"
          test -s "$APP_DIR/prosperity-upload.jks"
          cat >> "$APP_GRADLE" <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file("prosperity-upload.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.release }
              }
          }
          GRADLE
          echo "Persistent release signing configured." | tee signing-status.txt
      - name: Build debug APK when a Gradle project is present
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          WRAPPER="$(find source -type f -name gradlew -print -quit)"
          SETTINGS="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          BUILD_FILE="$(find source -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)"
          if [[ -n "$WRAPPER" ]]; then
            PROJECT_DIR="$(dirname "$WRAPPER")"
            chmod +x "$WRAPPER"
            cd "$PROJECT_DIR"
            ./gradlew --no-daemon --warning-mode=all --stacktrace assembleDebug
            if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
              ANDROID_KEYSTORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD}" ANDROID_KEY_ALIAS="${ANDROID_KEY_ALIAS}" ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD}" ./gradlew --no-daemon --warning-mode=all --stacktrace assembleRelease
            fi
          elif [[ -n "$SETTINGS" || -n "$BUILD_FILE" ]]; then
            if [[ -n "$SETTINGS" ]]; then PROJECT_DIR="$(dirname "$SETTINGS")"; else PROJECT_DIR="$(dirname "$BUILD_FILE")"; fi
            cd "$PROJECT_DIR"
            gradle --no-daemon --warning-mode=all --stacktrace assembleDebug
            if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
              ANDROID_KEYSTORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD}" ANDROID_KEY_ALIAS="${ANDROID_KEY_ALIAS}" ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD}" gradle --no-daemon --warning-mode=all --stacktrace assembleRelease
            fi
          else
            echo "No Gradle project was found in the uploaded source archive." | tee ../build-status.txt
            exit 1
          fi

      - name: Collect APK and diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p output
          find source -type f -name '*.apk' -exec cp --parents '{}' output/ \; || true
          cp source-files.txt gradle-markers.txt output/ 2>/dev/null || true
          # Keep the Android app sources in the diagnostic artifact for safe native refactoring.
          if [[ -d source/android/app/src/main ]]; then cp -a source/android/app/src/main output/android-main; fi
          cp source/android/app/build.gradle output/app-build.gradle 2>/dev/null || true
          cp signing-status.txt output/ 2>/dev/null || true
          if find output -type f -name '*.apk' | grep -q .; then
            echo 'APK build output found.' > output/BUILD-STATUS.txt
          else
            echo 'No APK produced. See the workflow log for the failure.' > output/BUILD-STATUS.txt
          fi

      - name: Upload APK or source diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mos2-android-build-output
          path: output/
          if-no-files-found: warn
