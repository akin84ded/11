name: MOS2 Android source check and APK build

on:
  workflow_dispatch:
  push:
    paths:
      - 'MOS2_Android_2.0_SOURCE.zip'
      - 'AndroidManifest.xml'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  inspect-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q MOS2_Android_2.0_SOURCE.zip -d source
          echo "Files extracted from source archive:"
          find source -maxdepth 5 -type f -printf '%p (%s bytes)\n' | sort | tee source-files.txt
          echo
          echo "Gradle project markers:"
          find source -type f \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \) -print | tee gradle-markers.txt

      - name: Repair Android build configuration
        shell: bash
        run: |
          set -euo pipefail
          PROPS="$(find source -type f -name gradle.properties -path '*/android/gradle.properties' -print -quit)"
          if [[ -z "$PROPS" ]]; then
            echo "Android Gradle properties file was not found" >&2
            exit 1
          fi
          grep -q '^android.useAndroidX=true$' "$PROPS" || echo 'android.useAndroidX=true' >> "$PROPS"
          grep -q '^android.enableJetifier=true$' "$PROPS" || echo 'android.enableJetifier=true' >> "$PROPS"
          # Repair an accidentally stored literal backslash-n in XML manifests.
          while IFS= read -r -d '' manifest; do
            python3 - "$manifest" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          s = s.replace(r"\n", "\n")
          p.write_text(s, encoding="utf-8")
          PY
          done < <(find source -type f -name AndroidManifest.xml -print0)
          echo "Updated $PROPS:"
          cat "$PROPS"

      - name: Build debug APK when a Gradle project is present
        shell: bash
        run: |
          set -euo pipefail
          WRAPPER="$(find source -type f -name gradlew -print -quit)"
          SETTINGS="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          BUILD_FILE="$(find source -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)"
          if [[ -n "$WRAPPER" ]]; then
            PROJECT_DIR="$(dirname "$WRAPPER")"
            chmod +x "$WRAPPER"
            cd "$PROJECT_DIR"
            ./gradlew --no-daemon assembleDebug
          elif [[ -n "$SETTINGS" || -n "$BUILD_FILE" ]]; then
            if [[ -n "$SETTINGS" ]]; then PROJECT_DIR="$(dirname "$SETTINGS")"; else PROJECT_DIR="$(dirname "$BUILD_FILE")"; fi
            cd "$PROJECT_DIR"
            gradle --no-daemon assembleDebug
          else
            echo "No Gradle project was found in the uploaded source archive." | tee ../build-status.txt
            exit 1
          fi

      - name: Collect APK and diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p output
          find source -type f -name '*.apk' -exec cp --parents '{}' output/ \; || true
          cp source-files.txt gradle-markers.txt output/ 2>/dev/null || true
          if find output -type f -name '*.apk' | grep -q .; then
            echo 'APK build output found.' > output/BUILD-STATUS.txt
          else
            echo 'No APK produced. See the workflow log for the failure.' > output/BUILD-STATUS.txt
          fi

      - name: Upload APK or source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mos2-android-build-output
          path: output/
          if-no-files-found: warn
