name: Prosperity historical strategy backtest

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/backtest_prosperity.py'
      - '.github/workflows/prosperity-backtest.yml'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run walk-forward backtest on MOEX candles
        run: python .github/scripts/backtest_prosperity.py
      - name: Upload backtest report
        uses: actions/upload-artifact@v4
        with:
          name: prosperity-historical-backtest
          path: |
            backtest-summary.json
            backtest-trades.csv
